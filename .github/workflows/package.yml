# Builds the downloadable packages for Linux, Windows and macOS: the fork, the plugins of this
# repository and the plugin launcher in one archive each. .github/package.sh does the work; this
# file gives it three machines and keeps the slow parts between runs.
#
# To cut a build:  git push origin main:release
# It ends in a draft release holding the three archives. Publishing the draft is up to a person.
name: package

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write  # the draft release

env:
  FORK_REPO: dzwiedziu-nkg/PrusaSlicer
  FORK_REF: main
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"  # CMake 4 refuses the older dependencies without it

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: linux, runner: ubuntu-24.04 }
          - { system: windows, runner: windows-2022 }
          - { system: macos, runner: macos-15 }  # Apple Silicon
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Line endings as committed
        run: git config --global core.autocrlf false  # Windows would hand bash a script with CRLF
      - uses: actions/checkout@v7
      - name: The fork
        id: fork
        run: |
          # The same place in every run: the built dependencies hold absolute paths. Short on
          # Windows, where they nest deeper than its 260 characters allow.
          if [ "$RUNNER_OS" = Windows ]; then root=C:; else root=$RUNNER_TEMP; fi
          echo "FORK=$root/f" >>"$GITHUB_ENV"
          echo "OUT=$root/o" >>"$GITHUB_ENV"
          git clone --depth 1 --branch "$FORK_REF" "https://github.com/$FORK_REPO" "$root/f"
          echo "commit=$(git -C "$root/f" rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "deps=$(git -C "$root/f" rev-parse HEAD:deps)" >>"$GITHUB_OUTPUT"
      - name: System packages
        run: |
          case $RUNNER_OS in
          Linux)
            sudo apt-get update
            # The fork's doc/Build.md list, then what the launcher and its test need.
            sudo apt-get install -y git build-essential autoconf cmake libtool libglu1-mesa-dev libgtk-3-dev \
              libdbus-1-dev libwebkit2gtk-4.1-dev libhidapi-dev texinfo python3-tk python3-venv xvfb ;;
          macOS)
            brew install automake cmake git gettext libtool texinfo ;;
          esac
      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'  # Linux freezes its own Python, the one whose Tk the package was tried with
        with:
          python-version: "3.13"
      # The launcher first: it takes a minute, and the build after it takes hours.
      - name: Launcher
        run: .github/package.sh launcher

      - name: Slicer built by an earlier run
        id: built
        uses: actions/cache/restore@v6
        with: &built
          key: built-1-${{ matrix.system }}-${{ steps.fork.outputs.commit }}
          # What `package.sh stage` takes from a build, without the gigabytes of object files.
          path: |
            ${{ env.FORK }}/build/src/slic3r-app-launcher/slic3r-app-launcher
            ${{ env.FORK }}/build/src/**/*.exe
            ${{ env.FORK }}/build/src/**/*.dll
            ${{ env.FORK }}/build/src/**/*.so
            ${{ env.FORK }}/build/src/Info.plist
            ${{ env.FORK }}/resources/matdb
      - name: Dependencies built by an earlier run
        id: deps
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with: &deps
          key: deps-1-${{ matrix.system }}-${{ steps.fork.outputs.deps }}
          path: ${{ env.FORK }}/deps/build/destdir
      - name: Dependencies
        if: steps.built.outputs.cache-hit != 'true' && steps.deps.outputs.cache-hit != 'true'
        run: .github/package.sh deps
      - name: Keep the dependencies
        if: steps.built.outputs.cache-hit != 'true' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with: *deps
      - name: Slicer
        if: steps.built.outputs.cache-hit != 'true'
        run: .github/package.sh slicer
      - name: Keep the slicer
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with: *built

      - name: Package
        run: |
          .github/package.sh stage
          .github/package.sh assemble
      - name: Smoke test
        timeout-minutes: 20  # a frozen program that fails says so in a dialog nobody is there to close
        run: |
          if [ "$RUNNER_OS" != Linux ]; then exec .github/package.sh smoke; fi
          # This machine has every library there is; a user's has what README.txt tells them to install.
          # --init: as a container's first process xvfb-run never hears that Xvfb is ready, and waits for ever.
          docker run --rm --init -v "$PWD:/repo:ro" -v "$FORK:/fork:ro" -v "$OUT:/out:ro" ubuntu:24.04 bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq xz-utils xvfb >/dev/null
            mkdir /o && tar -xJf /out/*.tar.xz -C /o
            apt-get install -y -qq $(sed -n "s/^ *sudo apt install //p" /o/*/README.txt) >/dev/null
            FORK=/fork OUT=/o /repo/.github/package.sh smoke' 2>&1 | tee "$OUT/logs/smoke.log"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.system }}
          path: |
            ${{ env.OUT }}/*.tar.xz
            ${{ env.OUT }}/*.zip
          compression-level: 0
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(ls packages | sed -n 's/^PrusaSlicer-plugin-fork-\(.*\)-linux-.*/\1/p')
          # One draft at a time: a newer build replaces the one nobody published.
          gh release list --json tagName,isDraft \
            --jq '.[] | select(.isDraft and (.tagName | contains("-plugins."))) | .tagName' |
            xargs -r -n1 gh release delete --yes
          gh release create "v$version-plugins.$GITHUB_RUN_NUMBER" packages/* --draft --prerelease \
            --target "$GITHUB_SHA" --title "PrusaSlicer $version with slicing plugins, build $GITHUB_RUN_NUMBER" \
            --notes-file - <<NOTES
          PrusaSlicer $version with eleven extra slicing hooks, the Lua plugins of this repository and a
          launcher that switches them on and off. An unofficial build, not a Prusa Research release.

          Download the archive of your system, unpack it, read its README.txt and start plugin-launcher.

          | Archive | Runs on |
          |---|---|
          | linux-x86_64 | Ubuntu 24.04 or a distribution as new, with GTK 3, WebKitGTK 4.1 and hidapi |
          | windows-x86_64 | Windows 10 or newer, 64-bit |
          | macos-arm64 | macOS 11 or newer on Apple Silicon |
          NOTES
